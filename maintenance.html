<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nextline Creative | Maintenance</title>
    <meta
      name="description"
      content="Nextline Creative is currently under maintenance. We will be back shortly."
    />
  </head>
  <body style="margin:0;font-family:Segoe UI,Arial,sans-serif;background:#071225;color:#e8eefc;">
    <div
      style="
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        background:
          radial-gradient(circle at 15% 20%, rgba(13,184,212,0.2), transparent 35%),
          radial-gradient(circle at 85% 15%, rgba(240,185,77,0.14), transparent 30%),
          linear-gradient(135deg, #071225 0%, #0d1f3d 60%, #0a1931 100%);
        padding:24px;
        box-sizing:border-box;
      "
    >
      <main
        style="
          width:100%;
          max-width:700px;
          border:1px solid rgba(255,255,255,0.14);
          background:rgba(10,22,46,0.78);
          backdrop-filter:blur(10px);
          border-radius:20px;
          padding:36px 28px;
          box-shadow:0 20px 60px rgba(0,0,0,0.45);
          text-align:center;
        "
      >
        <p
          style="
            margin:0 auto 14px;
            display:inline-block;
            padding:7px 12px;
            border-radius:999px;
            font-size:12px;
            letter-spacing:.08em;
            text-transform:uppercase;
            color:#a7b9e7;
            border:1px solid rgba(255,255,255,0.2);
            background:rgba(255,255,255,0.06);
          "
        >
          Nextline Creative
        </p>

        <h1
          style="
            margin:0 0 12px;
            font-size:clamp(28px,4vw,44px);
            line-height:1.15;
            color:#f7faff;
          "
        >
          We are upgrading the site
        </h1>

        <p
          style="
            margin:0 auto;
            max-width:560px;
            color:#c9d6f4;
            line-height:1.65;
            font-size:16px;
          "
        >
          Our website is temporarily under maintenance to improve performance and reliability.
          We will be back online shortly.
        </p>

        <div
          style="
            margin:24px auto 0;
            display:flex;
            flex-wrap:wrap;
            gap:10px;
            justify-content:center;
          "
        >
          <a
            href="mailto:hello@nextlinecreative.in"
            style="
              text-decoration:none;
              color:#081125;
              background:#20d3f5;
              font-weight:700;
              border-radius:999px;
              padding:11px 18px;
              display:inline-block;
            "
            >hello@nextlinecreative.in</a
          >
          <a
            href="tel:+919220340543"
            style="
              text-decoration:none;
              color:#e8eefc;
              border:1px solid rgba(255,255,255,0.35);
              border-radius:999px;
              padding:11px 18px;
              display:inline-block;
            "
            >+91 92203 40543</a
          >
        </div>

        <p style="margin:22px 0 0;color:#93a7d6;font-size:13px;">
          Thank you for your patience.
        </p>
      </main>
    </div>
  </body>
</html>
